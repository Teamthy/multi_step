<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Step Form</title>



    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 text-center">

                <form id="form">

                    <ul id="progressbar">
                        <li class="active">Step 1</li>
                        <li>Step 2</li>
                        <li>Step 3</li>
                        <li>Step 4</li>
                    </ul>

                    <div class="progress">
                        <div class="progress-bar"></div>
                    </div>

                    <fieldset>
                        <h2>Step 1</h2>
                        <input type="button" class="next-step" value="Next">
                    </fieldset>

                    <fieldset>
                        <h2>Step 2</h2>
                        <input type="button" class="next-step" value="Next">
                        <input type="button" class="previous-step" value="Back">
                    </fieldset>

                    <fieldset>
                        <h2>Step 3</h2>
                        <input type="button" class="next-step" value="Next">
                        <input type="button" class="previous-step" value="Back">
                    </fieldset>

                    <fieldset>
                        <h2>Done</h2>
                        <input type="button" class="previous-step" value="Back">
                    </fieldset>

                </form>

            </div>
        </div>
    </div>







</body>

</html>
